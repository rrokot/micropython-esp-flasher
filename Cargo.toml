[package]
name = "micropython-esp-flasher"
version = "0.5.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Install and update MicroPython on ESP32 boards"
repository = "https://github.com/rrokot/micropython-esp-flasher"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
espflash = { version = "4.6.0", default-features = false, features = ["serialport"] }
flate2 = "1.1.10"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"
semver = "1.0.28"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

name: Rust build

on:
  push:
    branches: [master, rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            executable: micropython-esp-flasher.exe
            rustflags: -C target-feature=+crt-static
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            executable: micropython-esp-flasher
            rustflags: ''
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            executable: micropython-esp-flasher
            rustflags: ''
          - runner: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            executable: micropython-esp-flasher
            rustflags: ''
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            executable: micropython-esp-flasher
            rustflags: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-cargo-about-0.9.2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build executable
        run: cargo build --release --locked
      - name: Build license notices
        run: |
          if [ "$(cargo-about --version 2>/dev/null)" != "cargo-about 0.9.2" ]; then
            cargo install cargo-about --version 0.9.2 --locked --features cli --force
          fi
          cargo about generate --locked --all-features about.hbs --output-file target/THIRD-PARTY-LICENSES.html
      - name: Create archive
        run: >-
          python scripts/package.py
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --executable target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Test packaged executable
        run: python scripts/check_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: micropython-esp-flasher-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
